address = "0.0.0.0"
port = 18081
io-threads = 1

storage-root = "storage"
web-root = "web"
log-root = "logs"

mysql-host = "127.0.0.1"
mysql-port = 3306
mysql-user = "filelink"
mysql-database = "filelink"
mysql-connect-timeout-seconds = 5

# 启用后使用 Redis 缓存会话哈希到用户 ID 的映射；Redis 故障时自动回退 MySQL。
redis-enabled = false
redis-host = "127.0.0.1"
redis-port = 6379
redis-timeout-milliseconds = 100
