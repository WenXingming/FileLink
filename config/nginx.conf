server {
    listen 80;
    server_name _; # 请将此替换为您的实际域名或 IP

    # 仅允许上游通过 X-Accel-Redirect 访问内容寻址对象。
    location /_filelink_objects/ {
        internal; # 声明为只供 Nginx 内部引用的路由（例如配合 X-Accel-Redirect 响应头使用），禁止外部 HTTP 客户端直接访问。
        alias /srv/filelink/storage/objects/; # 将重定向后的文件路径映射到容器内部挂载的物理存储目录。
    }

    location / {
        proxy_pass http://0.0.0.0:18081;
        
        # 传递真实 IP 和协议等相关的 Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 (如果需要)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
