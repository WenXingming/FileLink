server {
    listen 80;
    server_name _; # 请将此替换为您的实际域名或 IP

    # 仅允许上游通过 X-Accel-Redirect 访问内容寻址对象。
    location /_filelink_objects/ {
        internal;
        alias /srv/filelink/storage/objects/;

        # 普通文件使用 sendfile，分批让出 worker 事件循环。
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;

        # 超大文件改用线程 AIO + Direct I/O，避免大量占用 Page Cache。
        # directio 会自动禁用达到阈值请求的 sendfile。
        aio threads;
        directio 1g;
    }

    location / {
        proxy_pass http://0.0.0.0:18081;
        
        # 传递真实 IP 和协议等相关的 Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 (如果需要)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
