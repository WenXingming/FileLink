# 使用 Docker Compose 来管理 FileLink 的服务，启动命令：
# 
# 启动并以后台模式运行容器：
# cd /home/wxm/FileLink && sudo docker compose up -d
# 查看容器运行状态：
# cd /home/wxm/FileLink && sudo docker compose ps
# 查看容器日志：
# cd /home/wxm/FileLink && sudo docker compose logs -f
# 停止容器：
# cd /home/wxm/FileLink && sudo docker compose stop
# 重启容器：
# cd /home/wxm/FileLink && sudo docker compose restart
# 执行数据库迁移：
# cd /home/wxm/FileLink && sudo docker compose run --rm migrate
# 停止并删除容器：
# cd /home/wxm/FileLink && sudo docker compose down
#
# 注意：
#   1. Named volumes (mysql-data, redis-data) 将由 Docker 自动管理和持久化，无需手动创建宿主机目录。
#   2. 可以使用 Navicat 或其他数据库管理工具连接到 MySQL/Redis 服务，主机地址为 127.0.0.1，端口分别为 3306（MySQL）和 6379（Redis）。

services:
  # ===============================================================================================
  # --- MySQL 服务 ---
  # ===============================================================================================
  mysql:
    image: mysql:8.0.44-debian
    container_name: mysql-server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
      MYSQL_DATABASE: filelink
      MYSQL_USER: filelink
      MYSQL_PASSWORD: ${FILELINK_MYSQL_PASSWORD:?FILELINK_MYSQL_PASSWORD 未设置}
      TZ: Asia/Shanghai
    ports:
      - "0.0.0.0:${MYSQL_HOST_PORT:-3306}:3306" # 映射 0.0.0.0 上的 3306 端口到容器的 3306 端口
    volumes:
      - mysql-data:/var/lib/mysql  # 将主机的目录映射到容器内，确保数据持久化，/var/lib/mysql 是 MySQL 默认的数据目录
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===============================================================================================
  # --- 数据库迁移（一次性任务） ---
  # ===============================================================================================
  migrate:
    image: ghcr.io/amacneil/dbmate:2.33.0
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # dbmate 只接受数据库 URL；开发密码应使用 URL-safe 字符。
      DATABASE_URL: "mysql://filelink:${FILELINK_MYSQL_PASSWORD:?FILELINK_MYSQL_PASSWORD 未设置}@mysql:3306/filelink"
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    command: ["--wait", "migrate"]

  # ===============================================================================================
  # --- Redis 服务 ---
  # ===============================================================================================
  redis:
    image: redis:latest
    container_name: redis-server
    profiles: ["cache"] # docker compose --profile cache up -d redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==============================================================================================
  # --- Nginx 服务反向代理服务 ---
  # ==============================================================================================
  nginx:
    image: nginx:trixie-perl
    container_name: nginx-server
    profiles: ["proxy"] # docker compose --profile proxy up -d nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
